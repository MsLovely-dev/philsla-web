services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: philsa_local
      POSTGRES_USER: philsa
      POSTGRES_PASSWORD: philsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philsa -d philsa_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: local/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: unsafe-development-key
      ACTIVE_EXAM_CYCLE_ID: "2026"
      AUTH_EMAIL_PROVIDER: console
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql://philsa:philsa@db:5432/philsa_local?sslmode=disable
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --settings=config.settings.local && python manage.py runserver 0.0.0.0:8000 --settings=config.settings.local"

  frontend:
    build:
      context: ..
      dockerfile: local/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_AUTH_SERVICE_MODE: backend
      VITE_BACKEND_API_BASE_URL: http://localhost:8000
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  postgres_data:
